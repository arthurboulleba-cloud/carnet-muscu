<script>
(() => {
  const KEY = "carnet-offline-db";
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  const listeners = new Set();
  const docSnap = (path) => ({ id: path.split("/").pop(), exists: path in data, data: () => data[path], metadata: { fromCache: false, hasPendingWrites: false } });
  const notify = () => setTimeout(() => listeners.forEach((l) => l()), 0);
  function query(coll, field, dir, max) {
    const ref = {
      orderBy: (f, d = "asc") => query(coll, f, d, max),
      limit: (n) => query(coll, field, dir, n),
      onSnapshot(next) {
        const run = () => {
          let docs = Object.keys(data).filter((p) => p.startsWith(coll + "/") && p.split("/").length === coll.split("/").length + 1).map(docSnap);
          if (field) docs.sort((a, b) => (a.data()[field] > b.data()[field] ? 1 : -1) * (dir === "desc" ? -1 : 1));
          if (max) docs = docs.slice(0, max);
          next({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } });
        };
        listeners.add(run); setTimeout(run, 0);
        return () => listeners.delete(run);
      },
      doc: (id) => docRef(coll + "/" + id),
    };
    return ref;
  }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      async get() { return docSnap(path); },
      async set(body) { data[path] = JSON.parse(JSON.stringify(body)); save(); notify(); },
      async update(body) { data[path] = { ...(data[path] || {}), ...JSON.parse(JSON.stringify(body)) }; save(); notify(); },
      async delete() { delete data[path]; save(); notify(); },
      onSnapshot(next) { const run = () => next(docSnap(path)); listeners.add(run); setTimeout(run, 0); return () => listeners.delete(run); },
    };
  }
  const db = { collection: (c) => query(c), doc: docRef };
  window.claude = { use: async (name) => (name === "db" ? db : null) };
  // Everything is stored on the phone, so the app never needs to wait for the network
  try { Object.defineProperty(navigator, "onLine", { get: () => true, configurable: true }); } catch {}
})();
</script>

<style>
/* Layout: sober modern iOS — big bold title with a subtitle, generous rounded cards, round glass buttons, a floating glass tab bar.
   Monochrome; the today card is inverted (white on dark), the only tint is a soft green for a goal reached. */
:root {
  --bg: #f2f2f4;
  --card: #ffffff;
  --field: #ececef;
  --text: #0b0b0c;
  --text-2: rgba(60, 60, 67, 0.64);
  --text-3: rgba(60, 60, 67, 0.32);
  --line: rgba(0, 0, 0, 0.07);
  --inv: #0b0b0c;
  --on-inv: #ffffff;
  --on-inv-2: rgba(255, 255, 255, 0.62);
  --glass: rgba(255, 255, 255, 0.66);
  --glass-line: rgba(0, 0, 0, 0.07);
  --good: #4e8a39;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --out: cubic-bezier(0.23, 1, 0.32, 1);
  --drawer: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --card: #1b1b1d; --field: #2a2a2d; --text: #f5f5f7; --text-2: rgba(235, 235, 245, 0.6); --text-3: rgba(235, 235, 245, 0.3);
    --line: rgba(255, 255, 255, 0.08); --inv: #f5f5f7; --on-inv: #0b0b0c; --on-inv-2: rgba(11, 11, 12, 0.56);
    --glass: rgba(44, 44, 46, 0.6); --glass-line: rgba(255, 255, 255, 0.12); --good: #9ccc7a; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --card: #1b1b1d; --field: #2a2a2d; --text: #f5f5f7; --text-2: rgba(235, 235, 245, 0.6); --text-3: rgba(235, 235, 245, 0.3);
  --line: rgba(255, 255, 255, 0.08); --inv: #f5f5f7; --on-inv: #0b0b0c; --on-inv-2: rgba(11, 11, 12, 0.56);
  --glass: rgba(44, 44, 46, 0.6); --glass-line: rgba(255, 255, 255, 0.12); --good: #9ccc7a; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font: 400 16px/1.4 var(--font); letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button, input { touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 14px; }
button:disabled { opacity: 0.35; cursor: default; }
::selection { background: color-mix(in srgb, var(--text) 22%, transparent); }

.num { font-variant-numeric: tabular-nums; }

  padding-block: 18px calc(118px + env(safe-area-inset-bottom, 0px));
}
.v-in { animation: vIn 0.3s var(--out) both; }

/* Header */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 6px 0 18px; }
.head h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; margin: 0; text-wrap: balance; }

.head .acts { display: flex; gap: 10px; flex: none; }

}

.wide { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; margin-top: 12px; padding: 20px 22px; border-radius: 28px; background: var(--card); box-shadow: var(--shadow); }
.wide .big { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

.week { display: flex; gap: 6px; margin-top: 8px; }
.week i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.week i.on { background: var(--text); }

/* Lists inside cards */
.list { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 15px 20px; position: relative; min-height: 58px; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 20px; right: 20px; height: 1px; background: var(--line); }
button.row:active { background: var(--field); }
.row .rn { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; }

.order { display: flex; gap: 6px; }
.order button { width: 36px; height: 36px; border-radius: 50%; background: var(--field); display: grid; place-items: center; }

.sh { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 30px 4px 12px; }
.banner { font-size: 14px; color: var(--text-2); background: var(--card); border-radius: 20px; padding: 13px 16px; margin: 0 0 14px; }
.foot { font-size: 13px; color: var(--text-2); margin: 10px 6px 0; }
.sync { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin: -6px 4px 14px; }

@keyframes pulse { 50% { opacity: 0.3; } }

/* Workout */
.exo { background: var(--card); border-radius: 30px; box-shadow: var(--shadow); padding: 20px 18px 14px; margin-top: 12px; }
.exo-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

.goal .gk { font-size: 13px; color: var(--text-2); }
.goal .gv { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.goal .apply { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--inv); color: var(--on-inv); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; }

.in {

  font: 600 17px var(--font); font-variant-numeric: tabular-nums; text-align: center; padding: 0 6px; -moz-appearance: textfield; transition: background-color 0.2s;
}

.tick { width: 34px; height: 34px; border-radius: 50%; justify-self: end; box-shadow: inset 0 0 0 1.5px var(--text-3); display: grid; place-items: center; color: transparent; transition: background-color 0.2s var(--out), box-shadow 0.2s; }
.tick svg { width: 15px; height: 15px; overflow: visible; }

@keyframes draw { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }

<script>
// ---------- Workouts, tailored to Arthur (fat loss, V-taper, upper chest, posture, pull-ups). Three sets everywhere. ----------
const WORKOUTS = {
  "push": { name: "Push", exos: [
    { id: "incline-db", n: 3, reps: [6, 8], start: 32, note: "Banc à 30°. Le haut des pecs passe en premier." },
    { id: "bench", n: 3, reps: [5, 5], start: 77.5, note: "Lourd, pour garder ta force pendant la sèche." },
    { id: "ohp", n: 3, reps: [8, 8], start: 28 },
    { id: "lateral", n: 3, reps: [12, 15], start: 10, note: "Jusqu'aux épaules, descente lente." },
    { id: "dips", n: 3, reps: "max", start: 0, note: "Buste penché en avant." },
    { id: "triceps-rope", n: 3, reps: [12, 12], start: 9 },

    const date = cap(fmt(todayISO(), { weekday: "long", day: "numeric", month: "long" }));
    const w0 = WORKOUTS[tSid], run = RUNS[new Date().getDay()], d0 = getDraft(tSid);
    const hero = `<button class="today press" data-open-seance="${tSid}" aria-label="${d0 ? "Reprendre" : "Commencer"} ${esc(w0.name)}">
        <div class="k">${d0 ? "En cours" : "Prochaine séance"}</div>
        <div class="t">${esc(w0.name)}</div>
        <div class="m">${entriesFor(tSid).length} exercices, 3 séries${run ? `. Puis ${run}` : ""}.</div>
        <span class="go">${I.play}</span></button>`;
    const tiles = order.filter((s) => s !== tSid).map((sid) => {
      const w = WORKOUTS[sid];
      return `<button class="tile press" data-open-seance="${sid}">${done.has(sid) ? `<span class="done" aria-label="Faite cette semaine">${I.check}</span>` : ""}
        <span class="k">${lastTxt(sid)}</span><span><span class="t">${esc(w.name)}</span><span class="m" style="display:block">${entriesFor(sid).length} exercices</span></span></button>`;
    }).join("");
    const wNow = state.weights[0];
    const dots = order.map((s) => `<i class="${done.has(s) ? "on" : ""}"></i>`).join("");
    return { body: `${head("Séance", date, `<button class="circle press" data-go="program" aria-label="Programme">${I.grid}</button>`)}

  },

  program() {
    const id = state.split.active, order = orderOf(id), done = weekDone(), tSid = nextSid();
    const rows = order.map((sid, i) => {
      const w = WORKOUTS[sid];
      const right = state.editing
        ? `<span class="order"><button data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Monter ${esc(w.name)}">${I.up}</button><button data-down="${i}" ${i === order.length - 1 ? "disabled" : ""} aria-label="Descendre ${esc(w.name)}">${I.down}</button></span>`
        : `<span class="rv">${sid === tSid ? "Prochaine" : done.has(sid) ? "Faite" : ""}</span><span class="chev">${I.chev}</span>`;
      const inner = `<span class="rn">${i + 1}. ${esc(w.name)}<span class="rs">${lastTxt(sid)}, ${esc(entriesFor(sid).map((e) => lib(e.id).name).join(", "))}</span></span>${right}`;
      return state.editing ? `<div class="row">${inner}</div>` : `<button class="row" data-open-seance="${sid}">${inner}</button>`;
    }).join("");
    const why = id === "arnold-ppl" ? "Conseillé pour toi : le dos et les pecs passent en premier, quand tu es le plus frais."
      : id === "ppl-arnold" ? "Push, Pull, Legs, puis le split Arnold." : "Ton ordre à toi.";
    return { body: `${head("Programme", `${why} Les séances suivent cet ordre, sans jour fixe : la prochaine est celle qui suit ta dernière séance.`)}${splitChips()}<div class="list">${rows}</div>
      <div style="margin-top:14px"><button class="pill-btn soft press" data-edit>${state.editing ? "Terminé" : "Changer l'ordre"}</button></div>` };
  },

  seance(r) {
    const sid = r.sid, w = WORKOUTS[sid], d = getDraft(sid) || freshDraft(sid);
    const run = RUNS[new Date().getDay()] || "";
    const total = d.exos.reduce((n, e) => n + e.sets.length, 0), doneN = d.exos.reduce((n, e) => n + e.sets.filter((s) => s.done).length, 0);
    const exos = d.exos.map((e, ei) => {
      const k = kind(e.id), t = target(e), ok = t && e.sets.some((s) => hits(t, s)), last = lastFor(e.id);
      const cls = k === "kg" ? "" : k;
      const th = k === "kg" ? `<span></span><span>Avant</span><span>kg</span><span>reps</span><span></span>`
        : `<span></span><span>Avant</span><span>${k === "time" ? "secondes" : "reps"}</span><span></span>`;
      const rows = e.sets.map((s, j) => {
        const p = last ? last.sets[j] : null;
        const field = (f, v, mode, label) => `<input class="in" id="f-${ei}-${j}-${f}" name="${f}-${ei}-${j}" autocomplete="off" inputmode="${mode}" value="${v}" data-f="${ei}:${j}:${f}" aria-label="${label}, série ${j + 1}">`;
        const inputs = k === "time" ? field("sec", s.sec, "numeric", "Secondes") : k === "bw" ? field("reps", s.reps, "numeric", "Répétitions")
          : field("kg", num(parseNum(s.kg)), "decimal", "Poids") + field("reps", s.reps, "numeric", "Répétitions");
        return `<div class="tr ${cls} ${s.done ? "done" : ""}"><span class="n">${j + 1}</span><span class="prev">${p ? setTxt(e.id, p) : "–"}</span>${inputs}
          <button class="tick${state.just === `${ei}:${j}` ? " just" : ""}" data-done="${ei}:${j}" aria-pressed="${!!s.done}" aria-label="Série ${j + 1} faite">${I.check}</button></div>`;
      }).join("");
      const goal = !t ? "" : ok ? `<div class="goal ok"><span><span class="gk">Objectif atteint</span><br><span class="gv">${targetTxt(t)}</span></span></div>`
        : `<div class="goal"><span><span class="gk">Objectif, ${t.why}</span><br><span class="gv">${targetTxt(t)}</span></span><button class="apply press" data-apply="${ei}">Appliquer</button></div>`;
      return `<section class="exo"><div class="exo-top"><h2 class="exo-name">${esc(lib(e.id).name)}</h2><span class="tag">${presc(e)}</span></div>
        ${e.note ? `<p class="cue">${esc(e.note)}</p>` : ""}${goal}
        <div class="tbl"><div class="tr th ${cls}">${th}</div>${rows}</div>
        <div class="exo-foot"><span style="display:flex;gap:18px"><button class="textbtn" data-addset="${ei}">Ajouter une série</button>${d.exos.length > 1 ? `<button class="textbtn" data-rm="${ei}">Retirer l'exercice</button>` : ""}</span><span class="when">${last ? `Avant : ${fmt(last.date, { day: "numeric", month: "short" })}` : "Première fois"}</span></div></section>`;
    }).join("");
    const status = rest ? `<span class="status">Repos <b id="rest-t">${restTxt()}</b></span>` : `<span class="status">Séries <b>${doneN}/${total}</b></span>`;
    const dock = `<div class="glassbar">${status}<span class="right">${state.undo.length ? `<button class="circle press" style="width:46px;height:46px;background:var(--field);box-shadow:none" data-undo aria-label="Annuler la dernière action">${I.undo}</button>` : ""}${rest ? `<button class="pill-btn soft press" data-skiprest>Passer</button>` : ""}
      <button class="pill-btn press" data-finish="${sid}" ${doneN ? "" : "disabled"}>Terminer</button></span></div>`;
    const date = cap(fmt(todayISO(), { weekday: "long", day: "numeric", month: "long" }));
    return { dock, navRight: `<button class="circle glass press" data-menu="${sid}" aria-label="Options de la séance">${I.more}</button>`,
      body: `${head(esc(w.name), `${date}. ${d.exos.length} exercices, 3 séries${run ? `. Puis ${run}` : ""}.`)}${banner()}${exos}` };
  },

  progress() {
    const seen = [];
    for (const l of state.logs) for (const e of l.exos) if (!seen.includes(e.id)) seen.push(e.id);
    for (const id of Object.keys(state.baseline)) if (!seen.includes(id)) seen.push(id);
    const rows = seen.map((id) => {
      const b = bestFor(id), last = lastFor(id);
      return `<button class="row" data-go-exo="${id}"><span class="rn">${esc(lib(id).name)}<span class="rs">${last ? `Dernière fois ${setTxt(id, topSet(id, last.sets))}` : "Record importé de tes notes"}</span></span>
        <span class="tag">${b ? setTxt(id, b) : ""}</span><span class="chev">${I.chev}</span></button>`;
    }).join("");
    return { body: `${head("Progrès", "Ton record à droite, ta dernière séance dessous.", `<button class="circle press" data-go="history" aria-label="Toutes les séances">${I.grid}</button>`)}${banner()}
      ${rows ? `<div class="list">${rows}</div>` : `<p class="foot">Termine une séance pour voir ta progression ici.</p>`}` };
  },

  exo(r) {
    const id = r.id, k = kind(id), best = bestFor(id);
    const pts = [];
    for (const l of state.logs) {
      const e = l.exos.find((x) => x.id === id);
      if (e && e.sets.length) { const t = topSet(id, e.sets); pts.push({ date: l.date, top: t, val: score(id, t), sets: e.sets }); }
    }
    pts.reverse(); // oldest first
    const unit = k === "time" ? "s" : best && best.kg ? "kg" : "reps";
    const big = !best ? "–" : k === "time" ? `${best.sec}<small>s</small>` : best.kg ? `${num(best.kg)}<small>kg × ${best.reps}</small>` : `${best.reps}<small>reps</small>`;
    // Old vs new: each session against the one before it
    const rows = pts.map((p, i) => {
      const prev = pts[i - 1];
      let dv = "Première";
      if (prev) {
        const a = prev.top, b = p.top;
        if (k === "time") dv = `${b.sec - a.sec >= 0 ? "+" : "−"}${Math.abs(b.sec - a.sec)} s`;
        else if (b.kg && a.kg && b.kg !== a.kg) dv = `${b.kg > a.kg ? "+" : "−"}${num(Math.abs(b.kg - a.kg))} kg`;
        else dv = b.reps === a.reps ? "=" : `${b.reps > a.reps ? "+" : "−"}${Math.abs(b.reps - a.reps)} rep${Math.abs(b.reps - a.reps) > 1 ? "s" : ""}`;
      }
      return `<div class="row"><span class="rn">${p.sets.map((s) => setTxt(id, s)).join(", ")}<span class="rs">${cap(fmt(p.date, { weekday: "long", day: "numeric", month: "short" }))}</span></span>
        <span class="rv ${dv.startsWith("+") ? "up" : ""}">${dv}</span></div>`;
    }).reverse().join("");
    const oneRm = best && best.kg && k === "kg" ? `1RM estimé ${Math.round(best.kg * (1 + best.reps / 30))} kg` : "Ton meilleur résultat";
    return { body: `${head(esc(lib(id).name), "Record")}
      <div class="panel"><div class="hero-num">${big}</div><p class="k" style="margin:10px 0 0">${oneRm}</p>
        <div class="chart" style="margin-top:20px">${chart(pts, unit)}</div></div>
      <h2 class="sh">Avant et maintenant</h2>
      ${rows ? `<div class="list">${rows}</div>` : `<p class="foot">Pas encore de séance enregistrée sur cet exercice.</p>`}` };
  },

  weight() {
    const ws = state.weights, now = ws[0] ? ws[0].kg : null, first = ws.length ? ws[ws.length - 1] : null;
    const mid = (GOAL.lo + GOAL.hi) / 2, left = now ? Math.max(0, now - GOAL.hi) : null;
    const pct = now && first && first.kg > mid ? Math.min(1, Math.max(0, (first.kg - now) / (first.kg - mid))) : 0;
    let rate = "";
    if (ws.length >= 2) {
      const days = (new Date(ws[0].date) - new Date(first.date)) / 864e5;
      if (days >= 7) { const v = (first.kg - now) / (days / 7); rate = `En moyenne ${v >= 0 ? "−" : "+"}${num(Math.abs(v))} kg par semaine.`; }
    }
    const list = ws.slice(0, 30).map((w, i) => {
      const prev = ws[i + 1], dv = prev ? w.kg - prev.kg : 0;
      return `<div class="row"><span class="rn num">${num(w.kg)} kg<span class="rs">${cap(fmt(w.date, { weekday: "long", day: "numeric", month: "short" }))}</span></span>
        <span class="rv ${dv < 0 ? "up" : ""}">${dv ? `${dv > 0 ? "+" : "−"}${num(Math.abs(dv))}` : ""}</span></div>`;
    }).join("");
    return { body: `${head("Poids", `Objectif ${GOAL.lo} à ${GOAL.hi} kg${left ? `, encore ${num(left)} kg` : now ? ", atteint" : ""}.`)}${banner()}
      <div class="panel"><div class="hero-num">${now ? num(now) : "–"}<small>kg</small></div>
        <div class="track"><i style="width:${Math.round(pct * 100)}%"></i></div>
        <p class="k" style="margin:0">${rate || "Pèse-toi le matin à jeun, deux ou trois fois par semaine."}</p>
        <form class="weigh" id="weigh"><input class="in" id="w-in" name="poids" autocomplete="off" inputmode="decimal" placeholder="Poids du jour, ex. ${now ? num(now) : "94"}…" aria-label="Poids du jour en kilos">
          <button class="pill-btn press" type="submit">Enregistrer</button></form></div>
      ${list ? `<h2 class="sh">Pesées</h2><div class="list">${list}</div>` : ""}
      <h2 class="sh">Nutrition</h2><div class="list">
        <div class="row"><span class="rn">Dimanche au jeudi</span><span class="rv">2 100 à 2 200 kcal</span></div>
        <div class="row"><span class="rn">Vendredi et samedi</span><span class="rv">1 900 kcal</span></div>
        <div class="row"><span class="rn">Protéines</span><span class="rv">170 g par jour</span></div></div>` };
  },

  history() {
    const rows = state.logs.map((l) => `<button class="row" data-go-log="${l.id}"><span class="rn">${esc(NAMES[l.seance] || l.seance)}
      <span class="rs">${cap(fmt(l.date, { weekday: "long", day: "numeric", month: "short" }))}, ${l.exos.reduce((a, e) => a + e.sets.length, 0)} séries</span></span><span class="chev">${I.chev}</span></button>`).join("");
    return { body: `${head("Séances", "Toutes tes séances terminées.")}${banner()}
      ${rows ? `<div class="list">${rows}</div>
      <p class="foot"><button class="textbtn" data-wipe>Effacer tous mes progrès</button><br>Supprime toutes les séances et les records. Ton poids est gardé.</p>` : `<p class="foot">Tes séances terminées apparaîtront ici.</p>`}` };
  },

  log(r) {
    const l = state.logs.find((x) => x.id === r.id);
    if (!l) return { body: `<p class="foot">Séance introuvable.</p>` };
    const exos = l.exos.map((e) => `<section class="exo"><h2 class="exo-name">${esc(lib(e.id).name)}</h2>
      <div class="tbl">${e.sets.map((s, j) => `<div class="tr bw"><span class="n">${j + 1}</span><span class="prev" style="color:var(--text)">${setTxt(e.id, s)}</span><span></span>
        <span class="tick" aria-hidden="true" style="background:var(--inv);box-shadow:none;color:var(--on-inv)">${I.check}</span></div>`).join("")}</div></section>`).join("");
    return { body: `${head(esc(NAMES[l.seance] || l.seance), cap(fmt(l.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" })))}${exos}
      <p class="foot"><button class="textbtn" data-del-log="${l.id}">Supprimer cette séance</button></p>` };
  },
};

function chart(pts, unit) {
  if (pts.length < 2) return `<p class="k" style="margin:0">La courbe apparaîtra après deux séances sur cet exercice.</p>`;
  const W = 340, H = 120, px = 4, t = 18, b = 20;
  const vals = pts.map((p) => p.val);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(1, (hi - lo) * 0.25); lo -= pad; hi += pad;
  const x = (i) => px + (i * (W - px * 2)) / (pts.length - 1);
  const y = (v) => t + (1 - (v - lo) / (hi - lo)) * (H - t - b);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.val).toFixed(1)}`).join("");
  const L = pts.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de progression">
    <path d="${line}" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(L)}" cy="${y(pts[L].val)}" r="5" fill="var(--text)" stroke="var(--card)" stroke-width="2.5"/>
    <text x="${x(L)}" y="${y(pts[L].val) - 11}" text-anchor="end" font-size="12" font-weight="600" fill="var(--text)">${Math.round(pts[L].val)} ${unit}</text>
    <text x="0" y="${H - 3}" font-size="12" fill="var(--text-2)">${fmt(pts[0].date, { day: "numeric", month: "short" })}</text>
    <text x="${W}" y="${H - 3}" text-anchor="end" font-size="12" fill="var(--text-2)">${fmt(pts[L].date, { day: "numeric", month: "short" })}</text>
  </svg>`;
}

// ---------- sheets ----------
// The sheet is built once per opening; later renders only refresh its list, so it never replays its slide-in
function renderSheet() {
  const host = $("#sheet"), r = cur();
  if (!state.sheet || r.v !== "seance") { host.innerHTML = ""; host.dataset.key = ""; return; }
  const sid = r.sid, key = `${state.sheet}:${sid}`;
  const fresh = host.dataset.key !== key || !host.querySelector(".sheet");
  if (state.sheet === "add") {
    if (fresh) {
      host.innerHTML = `<div class="scrim" data-close></div><div class="sheet tall" role="dialog" aria-modal="true" aria-label="Ajouter un exercice"><div class="grab" aria-hidden="true"></div><div class="sheet-in">
        <div class="sheet-head"><h2>Ajouter</h2><button class="pill-btn soft press" style="height:38px;padding:0 16px" data-close>Annuler</button></div>
        <input class="search" id="exo-search" name="recherche" placeholder="Rechercher ou créer…" autocomplete="off" value="${esc(state.query)}">
        <div class="scroll"><div class="list" id="picks"></div></div></div></div>`;
    }
    host.dataset.key = key; renderPicks(sid); return;
  }

  if (fresh) {
    host.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Options de la séance"><div class="grab" aria-hidden="true"></div><div class="sheet-in">
      <div class="sheet-head"><h2>${esc(WORKOUTS[sid].name)}</h2><button class="pill-btn soft press" style="height:38px;padding:0 16px" data-close>OK</button></div>
      <div class="scroll"><div class="list" id="sheet-rows"></div>
        <div class="list"><button class="row" data-openadd="${sid}"><span class="rn">Ajouter un exercice</span><span class="chev">${I.plus}</span></button>
        <button class="row" data-discard="${sid}"><span class="rn danger">Effacer la séance du jour</span></button></div></div></div></div>`;
  }
  host.dataset.key = key;
  $("#sheet-rows").innerHTML = rows;
}
// Slide the sheet out before removing it; the exit is faster than the entry
function closeSheet() {
  const sh = $("#sheet .sheet"), sc = $("#sheet .scrim");
  state.sheet = null; state.query = "";
  if (!sh || window.matchMedia("(prefers-reduced-motion: reduce)").matches) { render(); return; }
  sh.classList.add("leaving"); if (sc) sc.classList.add("leaving");
  setTimeout(render, 200);
}
function renderPicks(sid) {
  const q = state.query.trim();
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const inDraft = new Set((getDraft(sid) || freshDraft(sid)).exos.map((e) => e.id));
  const all = { ...LIBRARY, ...state.plan.custom };
  const list = Object.entries(all).filter(([id, m]) => !inDraft.has(id) && !HIDDEN_IN_PICKER.includes(id) && (!q || norm(m.name).includes(norm(q))))
    .sort((a, b) => a[1].name.localeCompare(b[1].name, "fr"));
  const exact = list.some(([, m]) => norm(m.name) === norm(q));
  $("#picks").innerHTML = (q && !exact ? `<button class="row" data-create><span class="rn">Créer « ${esc(q)} »</span><span class="chev">${I.plus}</span></button>` : "") +
    list.map(([id, m]) => `<button class="row" data-addexo="${id}"><span class="rn">${esc(m.name)}</span><span class="chev">${I.plus}</span></button>`).join("");
}

// ---------- saving ----------
let toastTimer;
function flash(msg, withUndo = false) {
  state.toast = msg; state.toastUndo = withUndo; render(); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = ""; state.toastUndo = false; $(".toast")?.remove(); }, withUndo ? 5000 : 2200);
}
// Undo: snapshot what an action can change, restore it on "Annuler"
function snapshot() {
  state.undo.push({ drafts: JSON.stringify(state.drafts), plan: JSON.stringify(state.plan), split: JSON.stringify(state.split) });
  if (state.undo.length > 30) state.undo.shift();
}
function undo() {
  const s = state.undo.pop(); if (!s) return;
  const planChanged = s.plan !== JSON.stringify(state.plan), splitChanged = s.split !== JSON.stringify(state.split);
  state.drafts = JSON.parse(s.drafts); saveDrafts();
  state.plan = JSON.parse(s.plan); if (planChanged) persist("meta/workouts", state.plan);
  state.split = JSON.parse(s.split); if (splitChanged) saveSplit();
  stopRest(); state.sheet = null;
  flash("Annulé");
}
// Every write goes through the outbox: kept on the phone first, sent when the db answers
function persist(path, body) { queue(path, JSON.parse(JSON.stringify(body))); }
function queue(path, data) { outbox[path] = data; store("carnet-outbox", outbox); flush(); }
let flushing = null;
function flush() {
  if (flushing) return flushing;
  if (!db || !Object.keys(outbox).length) return Promise.resolve();
  flushing = (async () => {
    let sent = 0;
    for (const path of Object.keys(outbox)) {
      const data = outbox[path];
      // A write can hang instead of failing when the network drops; give up after 8 s and retry later
      try { await Promise.race([data === null ? db.doc(path).delete() : db.doc(path).set(data), new Promise((_, no) => setTimeout(() => no(new Error("timeout")), 8000))]); }
      catch { break; }
      if (outbox[path] === data) { delete outbox[path]; store("carnet-outbox", outbox); sent++; }
    }
    flushing = null;
    if (sent) softRender();
  })();
  return flushing;
}
const OFFLINE_SAVED = "Enregistrée sur ce téléphone, envoi dès que la connexion revient";
// Deleting a session also drops it from records and charts, which are computed from the logs
function deleteLogs(ids) {
  for (const id of ids) queue(`logs/${id}`, null);
  serverLogs = serverLogs.filter((l) => !ids.includes(l.id));
  state.logs = mergeLogs(serverLogs); saveCache();
}
function wipeProgress() {
  deleteLogs(state.logs.map((l) => l.id));
  state.baseline = {}; queue("meta/records", { records: {} }); saveCache();
}
function saveSplit() { store("carnet-split", state.split); persist("meta/split", state.split); }
function syncWorkout(sid) {
  const d = getDraft(sid);
  state.plan = { ...state.plan, seances: { ...state.plan.seances, [sid]: d.exos.map(({ sets, ...e }) => e) } };
  persist("meta/workouts", state.plan);
}
// The session is kept on the phone at once, so it is never lost; sending happens now or when the network is back
async function finish(sid) {
  const d = getDraft(sid); if (!d) return;
  const exos = d.exos.map((e) => ({ id: e.id, sets: e.sets.filter((s) => s.done).map((s) => kind(e.id) === "time"
    ? { kg: 0, reps: 0, sec: Math.round(parseNum(s.sec)) } : { kg: parseNum(s.kg), reps: Math.round(parseNum(s.reps)) }) })).filter((e) => e.sets.length);
  if (!exos.length) return;
  const path = `logs/${d.date}-${sid}`;
  queue(path, { date: d.date, seance: sid, exos });
  state.logs = mergeLogs(serverLogs);
  stopRest(); delete state.drafts[sid]; saveDrafts(); state.undo = []; // a finished session is final
  back();
  if (!db || !navigator.onLine) { flash(OFFLINE_SAVED); return; }
  await flush();
  flash(outbox[path] ? OFFLINE_SAVED : "Séance enregistrée");
}

// Rest timer, shown in the floating bar during a workout
let rest = null, restTimer = null;
const restTxt = () => { const left = rest ? Math.max(0, Math.ceil((rest.end - Date.now()) / 1000)) : 0; return `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; };
function startRest(sec) { primeAudio(); keepAwake(); rest = { end: Date.now() + sec * 1000 }; clearInterval(restTimer); restTimer = setInterval(tickRest, 500); }
// iPhone web apps cannot vibrate or use the Dynamic Island: end of rest = two short beeps, and the screen stays on
let audio = null, wake = null;
function primeAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch {} }
function beep() {
  if (!audio) return;
  try {
    for (const t of [0, 0.25]) {
      const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + t;
      o.frequency.value = 880; g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.3, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
      o.connect(g).connect(audio.destination); o.start(at); o.stop(at + 0.2);
    }
  } catch {}
}
async function keepAwake() {
  try { if (!wake && "wakeLock" in navigator) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && rest) keepAwake(); });
function stopRest() { rest = null; clearInterval(restTimer); }
function tickRest() {
  if (!rest) return;
  if (Date.now() >= rest.end) { try { navigator.vibrate?.([80, 60, 80]); } catch {} beep(); stopRest(); if (cur().v === "seance") render(); return; }
  const el = $("#rest-t"); if (el) el.textContent = restTxt();
}

// ---------- events ----------
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button, [data-close]");
  if (!b) return;
  const ds = b.dataset;
  if ("close" in ds) { closeSheet(); return; }
  if ("undo" in ds) { undo(); return; }
  if ("back" in ds) { back(); return; }
  if (ds.tab) { openTab(ds.tab); return; }
  if (ds.go) { go({ v: ds.go }); return; }
  if (ds.goExo) { go({ v: "exo", id: ds.goExo }); return; }
  if (ds.goLog) { go({ v: "log", id: ds.goLog }); return; }
  if (ds.delLog || "wipe" in ds) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Touche encore pour confirmer"; return; }
    if (ds.delLog) { deleteLogs([ds.delLog]); back(); flash("Séance supprimée"); }
    else { wipeProgress(); render(); flash("Progrès effacés"); }
    return;
  }
  if (ds.openSeance) { go({ v: "seance", sid: ds.openSeance }); return; }
  if (ds.activate) {
    if (ds.activate === state.split.active) return;
    snapshot();
    if (ds.activate === "custom" && !state.split.order) state.split = { active: "custom", order: [...activeOrder()] };
    else state.split = { ...state.split, active: ds.activate };
    state.editing = false; saveSplit(); flash(`${SPLITS[ds.activate].name} activé`, true); return;
  }
  if ("edit" in ds) {
    // Reordering a preset turns it into his own order
    if (!state.editing && state.split.active !== "custom") { snapshot(); state.split = { active: "custom", order: [...activeOrder()] }; saveSplit(); }
    state.editing = !state.editing; render(); return;
  }
  if (ds.up || ds.down) {
    const o = [...orderOf("custom")], i = Number(ds.up ?? ds.down), j = ds.up ? i - 1 : i + 1;
    if (j < 0 || j >= o.length) return;
    snapshot();
    [o[i], o[j]] = [o[j], o[i]]; state.split = { ...state.split, order: o }; saveSplit(); flash("Ordre changé", true); return;
  }
  if ("skiprest" in ds) { stopRest(); render(); return; }
  if (ds.menu) { state.sheet = "menu"; render(); return; }
  if (ds.openadd) {
    state.sheet = "add"; state.query = ""; render();
    // Only auto-focus with a mouse: on a phone the keyboard would jump up mid-animation
    if (window.matchMedia("(pointer: fine)").matches) setTimeout(() => $("#exo-search")?.focus(), 420);
    return;
  }
  if (ds.finish) { finish(ds.finish); return; }
  const r = cur();
  if (r.v !== "seance") return;
  const sid = r.sid;
  if (ds.discard) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.querySelector(".rn").textContent = "Touche encore pour effacer"; return; }
    snapshot(); stopRest(); delete state.drafts[sid]; saveDrafts(); state.sheet = null; flash("Séance effacée", true); return;
  }
  if (ds.addexo || "create" in ds) {
    snapshot();
    let id = ds.addexo;
    if (!id) {
      const name = state.query.trim(); if (!name) return;
      id = "c-" + slug(name); while (LIBRARY[id] || state.plan.custom[id]) id += "-2";
      state.plan = { ...state.plan, custom: { ...state.plan.custom, [id]: { name, step: 2.5, rest: 90 } } };
    }
    const k = lib(id).kind;
    const entry = { id, n: 3, reps: k === "bw" ? "max" : k === "time" ? "time" : [10, 12], start: k === "time" ? 45 : 0 };
    ensureDraft(sid).exos.push({ ...entry, sets: newSets(entry) });
    syncWorkout(sid); saveDrafts(); state.sheet = null; state.query = ""; flash(`${lib(id).name} ajouté`, true);
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 40);
    return;
  }
  if (ds.rm) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer"; return; }
    const d = ensureDraft(sid);
    if (d.exos.length === 1) return;
    snapshot();
    const [gone] = d.exos.splice(Number(ds.rm), 1); syncWorkout(sid); saveDrafts(); flash(`${lib(gone.id).name} retiré`, true); return;
  }
  if (ds.apply) {
    const e = ensureDraft(sid).exos[Number(ds.apply)], t = target(e); if (!t) return;
    snapshot();
    e.sets.forEach((s) => { if (s.done) return; if (t.sec != null) s.sec = t.sec; else { s.kg = t.kg; s.reps = t.reps; } });
    saveDrafts(); render(); return;
  }
  if (ds.done) {
    const [ei, j] = ds.done.split(":").map(Number);
    snapshot();
    const e = ensureDraft(sid).exos[ei], s = e.sets[j];
    s.done = !s.done; saveDrafts();
    if (s.done) { state.just = ds.done; try { navigator.vibrate?.(10); } catch {} startRest(lib(e.id).rest || 90); }
    render(); return;
  }
  if (ds.addset) {
    snapshot();
    const e = ensureDraft(sid).exos[Number(ds.addset)], p = e.sets[e.sets.length - 1];
    e.sets.push(p ? { ...p, done: false } : { kg: 0, reps: 10, done: false }); saveDrafts(); render(); return;
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "exo-search") { state.query = ev.target.value; renderPicks(cur().sid); }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (!el.dataset.f || cur().v !== "seance") return;
  const [ei, j, f] = el.dataset.f.split(":");
  snapshot();
  const s = ensureDraft(cur().sid).exos[Number(ei)].sets[Number(j)];
  s[f] = parseNum(el.value); saveDrafts();
  // Re-rendering here would close the phone keyboard; only needed when a ticked set changes the goal
  if (s.done) render();
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && state.sheet) closeSheet();
  if (ev.key === "Enter" && ev.target.id === "exo-search") $("#picks button")?.click();
});
document.addEventListener("submit", async (ev) => {
  if (ev.target.id !== "weigh") return;
  ev.preventDefault();
  const kg = parseNum($("#w-in").value);
  if (kg < 30 || kg > 250) { flash("Entre ton poids en kilos, par exemple 93,4"); return; }
  const path = `weights/${todayISO()}`;
  queue(path, { date: todayISO(), kg: Math.round(kg * 10) / 10 });
  state.weights = mergeWeights(serverWeights);
  if (!db || !navigator.onLine) { flash("Poids gardé sur ce téléphone, envoi dès que la connexion revient"); return; }
  await flush();
  flash(outbox[path] ? "Poids gardé sur ce téléphone, envoi dès que la connexion revient" : "Poids enregistré");
});

// Pull the sheet down by its handle or title to close it; a quick flick is enough
let drag = null;
document.addEventListener("touchstart", (ev) => {
  const h = ev.target.closest(".sheet .grab, .sheet .sheet-head");
  if (!h || ev.target.closest("button")) return;
  const sh = h.closest(".sheet");
  drag = { sh, y: ev.touches[0].clientY, t: Date.now(), dy: 0 };
  sh.style.animation = "none"; sh.style.transition = "none";
}, { passive: true });
document.addEventListener("touchmove", (ev) => {
  if (!drag) return;
  const dy = ev.touches[0].clientY - drag.y;
  drag.dy = dy > 0 ? dy : dy / 5; // resists when pulled up
  drag.sh.style.transform = `translateY(${drag.dy}px)`;
}, { passive: true });
document.addEventListener("touchend", () => {
  if (!drag) return;
  const { sh, dy, t } = drag; drag = null;
  const velocity = dy / Math.max(1, Date.now() - t);
  if (dy > 110 || (dy > 24 && velocity > 0.11)) {
    sh.style.transition = "transform 0.2s cubic-bezier(0.23, 1, 0.32, 1)"; sh.style.transform = "translateY(100%)";
    $("#sheet .scrim")?.classList.add("leaving");
    state.sheet = null; state.query = ""; setTimeout(render, 200);
  } else {
    sh.style.transition = "transform 0.3s cubic-bezier(0.23, 1, 0.32, 1)"; sh.style.transform = "";
  }
});

// ---------- start ----------
state.stack = [{ v: "home" }];
render();
// Listeners are re-opened when the network comes back after one of them failed
let unsubs = [];
function subscribe() {
  unsubs.forEach((u) => { try { u(); } catch {} });
  unsubs = [
    db.collection("logs").orderBy("date", "desc").limit(500).onSnapshot((snap) => {
      serverLogs = snap.docs.map((x) => ({ id: x.id, ...x.data() })).filter((l) => l.date && Array.isArray(l.exos));
      state.logs = mergeLogs(serverLogs); state.dbStatus = "ok"; saveCache(); render();
    }, () => { state.dbStatus = "error"; render(); }),
    db.doc("meta/records").onSnapshot((snap) => { state.baseline = (snap.exists && snap.data().records) || {}; saveCache(); render(); }, () => {}),
    // A change still waiting in the outbox is newer than what the db holds
    db.doc("meta/workouts").onSnapshot((snap) => {
      if (!snap.exists || outbox["meta/workouts"]) return;
      const p = snap.data(); state.plan = { seances: p.seances || {}, custom: p.custom || {} }; saveCache(); render();
    }, () => {}),
    db.doc("meta/split").onSnapshot((snap) => {
      if (!snap.exists || outbox["meta/split"]) return;
      const s = snap.data();
      if (SPLITS[s.active]) { state.split = { active: s.active, order: Array.isArray(s.order) ? s.order : null }; store("carnet-split", state.split); render(); }
    }, () => {}),
    db.collection("weights").orderBy("date", "desc").limit(200).onSnapshot((snap) => {
      serverWeights = snap.docs.map((x) => x.data()).filter((w) => w.date && w.kg);
      state.weights = mergeWeights(serverWeights); saveCache(); render();
    }, () => {}),
  ];
}
(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { state.dbStatus = "none"; render(); return; }
  subscribe(); flush();
})();
window.addEventListener("online", () => { if (db && state.dbStatus === "error") subscribe(); flush(); softRender(); });
window.addEventListener("offline", softRender);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });
setInterval(flush, 30000);
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
